# The offline test on every push: the guard's start profiles, its dialog rules in English and Russian and the
# fallback linetype files. It needs neither AutoCAD nor a display, but the guard imports pywin32: Windows only.
name: offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - name: install pywin32
        run: python -m pip install pywin32==312
      - name: guard test
        run: python acad_guard/test_start_profile.py
